<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{%t 오늘의 추천식단 - 1~5인 가족 하루 식단·다이어트 식단%} - {{SITE_NAME}}</title>
<meta name="description" content="{%t 아침·점심·저녁 하루 식단을 매일 새로 추천해요. 1인부터 5인 가족까지 재료 양과 장보기 목록을 맞춰 주고, 하루 1,500kcal 다이어트 식단도 있어요.%}">
<link rel="canonical" href="{{BASE}}/{{PFX}}meal.html">{{ALT}}{{ROBOTS}}
<meta property="og:title" content="{%t 오늘의 추천식단%}">
<meta property="og:description" content="{%t 1~5인 가족 맞춤 하루 식단과 장보기 목록, 다이어트 식단까지.%}">
<link rel="icon" type="image/png" sizes="32x32" href="assets/mascot/favicon-32.png">
<link rel="apple-touch-icon" href="assets/mascot/favicon-180.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
<header class="top"><a class="brand" href="./"><img class="brand-face" src="assets/mascot/face.png" width="30" height="30" alt="">{{SITE_NAME}}</a><p><a href="./">{%t ← 내 냉장고 재료로 찾기%}</a></p></header>
<main class="meal">
<h1>🍱 {%t 오늘의 추천식단%}</h1>
<p id="mdate" class="mdate"></p>
<div class="mctl">
<div class="mrow"><span class="flab">{%t 먹는 사람 수%}</span><div id="mpeople" class="seg" role="group" aria-label="{%t 먹는 사람 수%}"></div></div>
<div id="mmode" class="seg seg2" role="group" aria-label="{%t 식단 종류%}"></div>
</div>
<div id="mwx"></div>
<div id="msummary"></div>
<div id="mplan"></div>
<div class="mactions"><button id="mother" class="btn" type="button"></button></div>
<section id="mshop"></section>
<p id="mnote" class="note"></p>
<noscript><p>{%t 이 쪽은 자바스크립트가 켜져 있어야 식단을 보여 드려요.%}</p></noscript>
<p style="margin-top:22px"><a class="btn" href="./" style="text-decoration:none;display:inline-block">{%t 내 재료로 만들 수 있는 요리 찾기%}</a></p>
</main>
<footer>
{{DISCLOSURE}}
{%t <p>레시피는 일반적인 조리법이며 재료 상태와 불 세기에 따라 달라질 수 있어요. 영양성분은 식품성분표 평균값으로 계산한 추정치예요. 알레르기가 있다면 재료를 꼭 확인하세요.</p>%}
</footer>
</div>
<script>window.MEAL={{MEALDATA}};</script>
<script src="assets/meal.js"></script>
</body>
</html>
